<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jotap Films — Colorista</title>
<meta name="description" content="Portfólio de color grading." />
<link rel="icon" type="image/svg+xml" href="./favicon.svg?v=2" />

<!-- Preview ao compartilhar o link (WhatsApp, Instagram, LinkedIn...) -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Jotap Films" />
<meta property="og:title" content="Colorista — Jotap Films" />
<meta property="og:description" content="Portfólio de color grading." />
<meta property="og:url" content="https://jotapfilms.com/colorist" />
<meta property="og:image" content="https://jotapfilms.com/og.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:locale" content="pt_BR" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; background: #f5f4f0; color: #111111; -webkit-font-smoothing: antialiased; font-family: 'Inter', system-ui, sans-serif; }
  #root { width: 100%; }
  a { color: inherit; }
</style>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

</head>
<body>
<div id="root"></div>

<!-- Traduções, tema, a moldura do site e a lista do feed de color -->
<script src="i18n.js"></script>
<script src="theme.js"></script>
<script src="colorist.js"></script>
<script type="text/babel" src="site-chrome.jsx"></script>
<script type="text/babel" src="contact-modal.jsx"></script>

<script type="text/babel">
const TH = window.THEME;
const PALETTE = TH.palette;
const FONTS = TH.fonts;

/* ════════════════════════════════════════════════════════════════
   PÁGINA DO COLORISTA — jotapfilms.com/colorist
   --------------------------------------------------------------
   Primeira tela: um feed de capas coladas, sempre coloridas (o
   resto do site é preto e branco; aqui a cor é o assunto). Passar
   o mouse mostra o nome e o ano; clicar abre a galeria daquele
   trabalho.

   Os trabalhos e as fotos vêm de colorist.js.
   ════════════════════════════════════════════════════════════════ */

const TRABALHOS = (window.COLORIST || []).filter((t) => !t.hidden);

// ─── Capa do feed ──────────────────────────────────────────────
function Capa({ item, onOpen, isMobile }) {
  const [hover, setHover] = React.useState(false);

  return (
    <div
      onClick={onOpen}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        position: 'relative',
        aspectRatio: '16 / 9',
        background: PALETTE.surface,
        overflow: 'hidden',
        cursor: 'pointer',
      }}
    >
      {item.cover && (
        <img
          src={item.cover} alt={item.title}
          style={{
            position: 'absolute', inset: 0, width: '100%', height: '100%',
            objectFit: 'cover',
            // Sempre colorida, ao contrário das capas do resto do site
            transform: hover ? 'scale(1.04)' : 'scale(1)',
            transition: 'transform 0.6s cubic-bezier(0.2,0.8,0.2,1)',
          }}
        />
      )}

      {/* Nome e ano, no hover */}
      <div style={{
        position: 'absolute', inset: 0,
        display: 'flex', flexDirection: 'column', justifyContent: 'flex-end',
        padding: isMobile ? 16 : 24,
        background: hover
          ? 'linear-gradient(to top, rgba(17,17,17,0.72) 0%, rgba(17,17,17,0.18) 45%, rgba(17,17,17,0) 75%)'
          : 'linear-gradient(to top, rgba(17,17,17,0) 0%, rgba(17,17,17,0) 100%)',
        opacity: hover ? 1 : 0,
        transition: 'opacity 0.3s, background 0.3s',
      }}>
        <div style={{
          fontFamily: FONTS.sans,
          fontSize: isMobile ? 15 : 17,
          fontWeight: 600,
          letterSpacing: '-0.01em',
          lineHeight: 1.2,
          color: '#fff',
          transform: hover ? 'translateY(0)' : 'translateY(6px)',
          transition: 'transform 0.35s cubic-bezier(0.2,0.8,0.2,1)',
        }}>
          {item.title}
        </div>
        <div style={{
          marginTop: 4,
          fontFamily: FONTS.sans,
          fontSize: 12,
          color: 'rgba(255,255,255,0.75)',
          transform: hover ? 'translateY(0)' : 'translateY(6px)',
          transition: 'transform 0.35s cubic-bezier(0.2,0.8,0.2,1) 0.03s',
        }}>
          {item.year}
        </div>
      </div>
    </div>
  );
}

// ─── Galeria de um trabalho ────────────────────────────────────
function Galeria({ item, onClose, isMobile, lang }) {
  const { useEffect } = React;
  const T = window.I18N[lang];

  useEffect(() => {
    if (!item) return;
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    const antes = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => {
      document.removeEventListener('keydown', onKey);
      document.body.style.overflow = antes;
    };
  }, [item, onClose]);

  if (!item) return null;

  const fotos = item.photos || [];

  return (
    <div
      onClick={onClose}
      style={{
        position: 'fixed', inset: 0, zIndex: 200,
        background: 'rgba(245,244,240,0.98)',
        overflowY: 'auto',
      }}
    >
      {/* Fechar */}
      <button
        onClick={onClose}
        style={{
          position: 'fixed', top: isMobile ? 16 : 24, right: isMobile ? 16 : 28, zIndex: 2,
          width: 40, height: 40, borderRadius: 20,
          border: `1px solid ${PALETTE.line}`,
          background: PALETTE.bg, color: PALETTE.fg,
          fontSize: 20, lineHeight: 1, cursor: 'pointer',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          transition: 'background 0.2s',
        }}
        onMouseEnter={(e) => (e.currentTarget.style.background = PALETTE.surface)}
        onMouseLeave={(e) => (e.currentTarget.style.background = PALETTE.bg)}
      >×</button>

      <div onClick={(e) => e.stopPropagation()}>
        {/* Nome e ano do trabalho */}
        <div style={{ padding: isMobile ? '72px 20px 28px' : '96px 40px 40px' }}>
          <h2 style={TH.heading(isMobile ? 'clamp(28px, 8vw, 40px)' : 'clamp(32px, 3.2vw, 56px)')}>
            {item.title}
          </h2>
          <div style={{ ...TH.label, marginTop: 10 }}>{item.year}</div>
        </div>

        {/* As fotos — mesma grade colada do feed, descendo até acabar */}
        {fotos.length > 0 ? (
          <div style={{
            display: 'grid',
            gridTemplateColumns: isMobile ? 'repeat(2, 1fr)' : 'repeat(3, 1fr)',
            gap: 0,
          }}>
            {fotos.map((src, i) => (
              <div key={i} style={{
                position: 'relative',
                aspectRatio: '16 / 9',
                background: PALETTE.surface,
                overflow: 'hidden',
              }}>
                <img src={src} alt={`${item.title} ${i + 1}`}
                  style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover' }} />
              </div>
            ))}
          </div>
        ) : (
          <div style={{
            margin: isMobile ? '0 20px' : '0 40px',
            padding: isMobile ? '48px 20px' : '80px 40px',
            border: `1px dashed ${PALETTE.line}`,
            textAlign: 'center',
            ...TH.label,
          }}>
            {T.colorGrade.soon}
          </div>
        )}

        {/* Respiro no fim */}
        <div style={{ height: isMobile ? 48 : 80 }} />
      </div>
    </div>
  );
}

function App() {
  const isMobile = window.useIsMobile();
  const [lang, setLangState] = React.useState(window.getInitialLang());
  const setLang = (next) => { setLangState(next); window.persistLang(next); };
  const T = window.I18N[lang];
  const [contactOpen, setContactOpen] = React.useState(false);
  const [aberto, setAberto] = React.useState(null);
  const ContactModal = window.ContactModal;
  const Seta = window.Seta;

  return (
    <div style={{ width: '100%' }}>
      {ContactModal && <ContactModal open={contactOpen} onClose={() => setContactOpen(false)} lang={lang} />}
      <window.SiteHeader current="colorist" lang={lang} setLang={setLang} onContactOpen={() => setContactOpen(true)} />

      {/* Abertura */}
      <section style={{
        padding: isMobile ? '104px 20px 36px' : '150px 40px 48px',
      }}>
        <a href="./index.html" style={{ ...TH.link, display: 'inline-block', marginBottom: isMobile ? 20 : 28, color: PALETTE.muted }}
          onMouseEnter={(e) => (e.currentTarget.style.color = PALETTE.fg)}
          onMouseLeave={(e) => (e.currentTarget.style.color = PALETTE.muted)}
        >{T.backToWorks}</a>
        <Seta size={isMobile ? 22 : 28} />
        <h1 style={{ ...TH.heading(isMobile ? 'clamp(44px, 13vw, 72px)' : 'clamp(56px, 6.2vw, 108px)'), marginTop: isMobile ? 20 : 28 }}>
          {T.colorist.heading}
        </h1>
      </section>

      {/* O feed — capas coladas, de ponta a ponta da tela */}
      <div style={{
        width: '100%',
        display: 'grid',
        gridTemplateColumns: isMobile ? 'repeat(2, 1fr)' : 'repeat(auto-fill, minmax(420px, 1fr))',
        gap: 0,
      }}>
        {TRABALHOS.map((item, i) => (
          <Capa key={i} item={item} isMobile={isMobile} onOpen={() => setAberto(i)} />
        ))}
      </div>

      <Galeria
        item={aberto !== null ? TRABALHOS[aberto] : null}
        onClose={() => setAberto(null)}
        isMobile={isMobile}
        lang={lang}
      />

      <window.ContactCta lang={lang} isMobile={isMobile} />
      <window.SiteFooter lang={lang} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
