<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jotap Films — Colorista</title>
<meta name="description" content="Portfólio de color grading." />
<link rel="icon" type="image/svg+xml" href="./favicon.svg?v=2" />

<!-- Preview ao compartilhar o link (WhatsApp, Instagram, LinkedIn...) -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Jotap Films" />
<meta property="og:title" content="Colorista — Jotap Films" />
<meta property="og:description" content="Portfólio de color grading." />
<meta property="og:url" content="https://jotapfilms.com/colorist" />
<meta property="og:image" content="https://jotapfilms.com/og.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:locale" content="pt_BR" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; background: #f5f4f0; color: #111111; -webkit-font-smoothing: antialiased; font-family: 'Inter', system-ui, sans-serif; }
  #root { width: 100%; }
  a { color: inherit; }
</style>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

</head>
<body>
<div id="root"></div>

<!-- Traduções, tema, a moldura do site e a lista do feed de color -->
<script src="i18n.js"></script>
<script src="theme.js"></script>
<script src="colorist.js"></script>
<script type="text/babel" src="site-chrome.jsx"></script>
<script type="text/babel" src="contact-modal.jsx"></script>

<script type="text/babel">
const TH = window.THEME;
const PALETTE = TH.palette;
const FONTS = TH.fonts;

/* ════════════════════════════════════════════════════════════════
   PÁGINA DO COLORISTA — jotapfilms.com/colorist
   --------------------------------------------------------------
   Primeira tela: um feed de capas coladas, sempre coloridas (o
   resto do site é preto e branco; aqui a cor é o assunto). Passar
   o mouse mostra o nome e o ano; clicar abre a galeria daquele
   trabalho.

   Os trabalhos e as fotos vêm de colorist.js.
   ════════════════════════════════════════════════════════════════ */

const TRABALHOS = (window.COLORIST || []).filter((t) => !t.hidden);

// Coluna de rótulo + valor(es), a mesma da home
function Coluna({ label, items }) {
  if (!items) return null;
  return (
    <div>
      <div style={{ ...TH.label, marginBottom: 6 }}>{label}</div>
      {(Array.isArray(items) ? items : [items]).map((it, i) => (
        <div key={i} style={{ fontFamily: FONTS.sans, fontSize: 13, lineHeight: 1.5, color: PALETTE.fg }}>{it}</div>
      ))}
    </div>
  );
}

// ─── Capa do feed ──────────────────────────────────────────────
function Capa({ item, onOpen, isMobile }) {
  const [hover, setHover] = React.useState(false);

  return (
    <div
      onClick={onOpen}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        position: 'relative',
        aspectRatio: '16 / 9',
        background: PALETTE.surface,
        overflow: 'hidden',
        cursor: 'pointer',
      }}
    >
      {item.cover && (
        <img
          src={item.cover} alt={item.title}
          style={{
            position: 'absolute', inset: 0, width: '100%', height: '100%',
            objectFit: 'cover',
            // Sempre colorida, ao contrário das capas do resto do site
            transform: hover ? 'scale(1.04)' : 'scale(1)',
            transition: 'transform 0.6s cubic-bezier(0.2,0.8,0.2,1)',
          }}
        />
      )}

      {/* Nome e ano, no hover */}
      <div style={{
        position: 'absolute', inset: 0,
        display: 'flex', flexDirection: 'column', justifyContent: 'flex-end',
        padding: isMobile ? 16 : 24,
        background: hover
          ? 'linear-gradient(to top, rgba(17,17,17,0.72) 0%, rgba(17,17,17,0.18) 45%, rgba(17,17,17,0) 75%)'
          : 'linear-gradient(to top, rgba(17,17,17,0) 0%, rgba(17,17,17,0) 100%)',
        opacity: hover ? 1 : 0,
        transition: 'opacity 0.3s, background 0.3s',
      }}>
        <div style={{
          fontFamily: FONTS.sans,
          fontSize: isMobile ? 15 : 17,
          fontWeight: 600,
          letterSpacing: '-0.01em',
          lineHeight: 1.2,
          color: '#fff',
          transform: hover ? 'translateY(0)' : 'translateY(6px)',
          transition: 'transform 0.35s cubic-bezier(0.2,0.8,0.2,1)',
        }}>
          {item.title}
        </div>
        <div style={{
          marginTop: 4,
          fontFamily: FONTS.sans,
          fontSize: 12,
          color: 'rgba(255,255,255,0.75)',
          transform: hover ? 'translateY(0)' : 'translateY(6px)',
          transition: 'transform 0.35s cubic-bezier(0.2,0.8,0.2,1) 0.03s',
        }}>
          {item.year}
        </div>
      </div>
    </div>
  );
}

// ─── Visor: uma foto por vez, setas do teclado ou arrasto ──────
function Visor({ fotos, indice, titulo, onFechar, onIr, isMobile }) {
  const toqueX = React.useRef(null);

  if (indice === null) return null;

  // Botão redondo das setas e do fechar, sobre o fundo escuro
  const botao = (extra) => ({
    position: 'fixed', zIndex: 2,
    width: 44, height: 44, borderRadius: 22,
    border: '1px solid rgba(255,255,255,0.25)',
    background: 'rgba(255,255,255,0.08)', color: '#fff',
    fontSize: 18, lineHeight: 1, cursor: 'pointer',
    display: 'flex', alignItems: 'center', justifyContent: 'center',
    transition: 'background 0.2s',
    ...extra,
  });
  const aceso = (e) => (e.currentTarget.style.background = 'rgba(255,255,255,0.2)');
  const apagado = (e) => (e.currentTarget.style.background = 'rgba(255,255,255,0.08)');

  return (
    <div
      // stopPropagation: o visor mora dentro da galeria, e sem isso o
      // clique fecharia as duas de uma vez.
      onClick={(e) => { e.stopPropagation(); onFechar(); }}
      // Arrastar pro lado troca a foto (celular)
      onTouchStart={(e) => { toqueX.current = e.touches[0].clientX; }}
      onTouchEnd={(e) => {
        if (toqueX.current === null) return;
        const d = e.changedTouches[0].clientX - toqueX.current;
        if (Math.abs(d) > 50) onIr(d < 0 ? 1 : -1);
        toqueX.current = null;
      }}
      style={{
        position: 'fixed', inset: 0, zIndex: 300,
        // Fundo escuro: é onde a cor da foto se lê melhor
        background: 'rgba(12,12,12,0.97)',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        padding: isMobile ? '64px 12px' : '72px 88px',
        touchAction: 'pan-y',
      }}
    >
      <button onClick={(e) => { e.stopPropagation(); onFechar(); }}
        style={botao({ top: isMobile ? 16 : 24, right: isMobile ? 16 : 28 })}
        onMouseEnter={aceso} onMouseLeave={apagado}
      >×</button>

      {/* Setas só no desktop; no celular o arrasto faz o papel */}
      {!isMobile && fotos.length > 1 && (
        <>
          <button onClick={(e) => { e.stopPropagation(); onIr(-1); }}
            style={botao({ left: 24, top: '50%', marginTop: -22 })}
            onMouseEnter={aceso} onMouseLeave={apagado}
          >‹</button>
          <button onClick={(e) => { e.stopPropagation(); onIr(1); }}
            style={botao({ right: 24, top: '50%', marginTop: -22 })}
            onMouseEnter={aceso} onMouseLeave={apagado}
          >›</button>
        </>
      )}

      <img
        src={fotos[indice]}
        alt={`${titulo} ${indice + 1}`}
        onClick={(e) => e.stopPropagation()}
        style={{
          maxWidth: '100%', maxHeight: '100%',
          objectFit: 'contain', display: 'block',
        }}
      />

      {/* Contador */}
      <div style={{
        position: 'fixed', bottom: isMobile ? 20 : 28, left: 0, right: 0,
        textAlign: 'center',
        fontFamily: FONTS.sans, fontSize: 12,
        color: 'rgba(255,255,255,0.6)',
        pointerEvents: 'none',
      }}>
        {indice + 1} / {fotos.length}
      </div>
    </div>
  );
}

// ─── Galeria de um trabalho ────────────────────────────────────
function Galeria({ item, onClose, isMobile, lang }) {
  const { useEffect } = React;
  const T = window.I18N[lang];
  const [foto, setFoto] = React.useState(null);

  const fotos = (item && item.photos) || [];

  // Anda pela lista dando a volta no fim
  const irFoto = React.useCallback((passo) => {
    setFoto((i) => (i === null ? null : (i + passo + fotos.length) % fotos.length));
  }, [fotos.length]);

  // Um tratador só pros dois níveis: com o visor aberto, o Esc fecha
  // só ele, não a galeria junto.
  useEffect(() => {
    if (!item) return;
    const onKey = (e) => {
      if (foto !== null) {
        if (e.key === 'Escape') setFoto(null);
        if (e.key === 'ArrowRight') { irFoto(1); e.preventDefault(); }
        if (e.key === 'ArrowLeft') { irFoto(-1); e.preventDefault(); }
        return;
      }
      if (e.key === 'Escape') onClose();
    };
    document.addEventListener('keydown', onKey);
    const antes = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => {
      document.removeEventListener('keydown', onKey);
      document.body.style.overflow = antes;
    };
  }, [item, onClose, foto, irFoto]);

  // Fechou a galeria: o visor não pode ficar pendurado
  useEffect(() => { if (!item) setFoto(null); }, [item]);

  if (!item) return null;

  return (
    <div
      onClick={onClose}
      style={{
        position: 'fixed', inset: 0, zIndex: 200,
        background: 'rgba(245,244,240,0.98)',
        overflowY: 'auto',
      }}
    >
      {/* Fechar */}
      <button
        onClick={onClose}
        style={{
          position: 'fixed', top: isMobile ? 16 : 24, right: isMobile ? 16 : 28, zIndex: 2,
          width: 40, height: 40, borderRadius: 20,
          border: `1px solid ${PALETTE.line}`,
          background: PALETTE.bg, color: PALETTE.fg,
          fontSize: 20, lineHeight: 1, cursor: 'pointer',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          transition: 'background 0.2s',
        }}
        onMouseEnter={(e) => (e.currentTarget.style.background = PALETTE.surface)}
        onMouseLeave={(e) => (e.currentTarget.style.background = PALETTE.bg)}
      >×</button>

      <div onClick={(e) => e.stopPropagation()}>
        {/* Nome e ano do trabalho */}
        <div style={{ padding: isMobile ? '72px 20px 28px' : '96px 40px 40px' }}>
          <h2 style={TH.heading(isMobile ? 'clamp(28px, 8vw, 40px)' : 'clamp(32px, 3.2vw, 56px)')}>
            {item.title}
          </h2>
          <div style={{ ...TH.label, marginTop: 10 }}>{item.year}</div>
        </div>

        {/* As fotos — mesma grade colada do feed, descendo até acabar */}
        {fotos.length > 0 ? (
          <div style={{
            display: 'grid',
            gridTemplateColumns: isMobile ? 'repeat(2, 1fr)' : 'repeat(3, 1fr)',
            gap: 0,
          }}>
            {fotos.map((src, i) => (
              <div key={i}
                onClick={() => setFoto(i)}
                style={{
                  position: 'relative',
                  aspectRatio: '16 / 9',
                  background: PALETTE.surface,
                  overflow: 'hidden',
                  cursor: 'pointer',
                }}>
                <img src={src} alt={`${item.title} ${i + 1}`}
                  style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover' }} />
              </div>
            ))}
          </div>
        ) : (
          <div style={{
            margin: isMobile ? '0 20px' : '0 40px',
            padding: isMobile ? '48px 20px' : '80px 40px',
            border: `1px dashed ${PALETTE.line}`,
            textAlign: 'center',
            ...TH.label,
          }}>
            {T.colorGrade.soon}
          </div>
        )}

        {/* Respiro no fim */}
        <div style={{ height: isMobile ? 48 : 80 }} />
      </div>

      {/* Uma foto por vez, por cima da galeria */}
      <Visor
        fotos={fotos}
        indice={foto}
        titulo={item.title}
        onFechar={() => setFoto(null)}
        onIr={irFoto}
        isMobile={isMobile}
      />
    </div>
  );
}

function App() {
  const isMobile = window.useIsMobile();
  const [lang, setLangState] = React.useState(window.getInitialLang());
  const setLang = (next) => { setLangState(next); window.persistLang(next); };
  const T = window.I18N[lang];
  const [contactOpen, setContactOpen] = React.useState(false);
  const [aberto, setAberto] = React.useState(null);
  const ContactModal = window.ContactModal;
  const Seta = window.Seta;

  return (
    <div style={{ width: '100%' }}>
      {ContactModal && <ContactModal open={contactOpen} onClose={() => setContactOpen(false)} lang={lang} />}
      <window.SiteHeader current="colorist" lang={lang} setLang={setLang} onContactOpen={() => setContactOpen(true)} />

      {/* Abertura: título à esquerda, ficha e descrição à direita */}
      <section style={{
        padding: isMobile ? '104px 20px 36px' : '150px 40px 48px',
        display: 'grid',
        gridTemplateColumns: isMobile ? '1fr' : '1fr 1fr',
        columnGap: 40, rowGap: isMobile ? 36 : 48,
        alignItems: 'start',
      }}>
        <div>
          <a href="./index.html" style={{ ...TH.link, display: 'inline-block', marginBottom: isMobile ? 20 : 28, color: PALETTE.muted }}
            onMouseEnter={(e) => (e.currentTarget.style.color = PALETTE.fg)}
            onMouseLeave={(e) => (e.currentTarget.style.color = PALETTE.muted)}
          >{T.backToWorks}</a>
          <Seta size={isMobile ? 22 : 28} />
          <h1 style={{ ...TH.heading(isMobile ? 'clamp(44px, 13vw, 72px)' : 'clamp(56px, 6.2vw, 108px)'), marginTop: isMobile ? 20 : 28 }}>
            {T.colorist.heading}
          </h1>
        </div>

        <div style={{ display: 'flex', flexDirection: 'column', gap: isMobile ? 28 : 56, paddingTop: isMobile ? 0 : 4 }}>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 24 }}>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
              <Coluna label={T.colorist.roleLabel} items={T.colorist.role} />
              <Coluna label={T.home.locationLabel} items={T.home.location} />
              <Coluna label={T.home.serveLabel} items={T.home.serve} />
            </div>
            <Coluna label={T.colorist.servicesLabel} items={T.colorist.services} />
          </div>
          <div>
            <div style={{ ...TH.label, marginBottom: 8 }}>{T.home.descriptionLabel}</div>
            <p style={{ ...TH.body(isMobile ? 14 : 15), maxWidth: 560 }}>{T.colorist.description}</p>
          </div>
        </div>
      </section>

      {/* O feed — capas coladas, de ponta a ponta da tela */}
      <div style={{
        width: '100%',
        display: 'grid',
        gridTemplateColumns: isMobile ? 'repeat(2, 1fr)' : 'repeat(auto-fill, minmax(420px, 1fr))',
        gap: 0,
      }}>
        {TRABALHOS.map((item, i) => (
          <Capa key={i} item={item} isMobile={isMobile} onOpen={() => setAberto(i)} />
        ))}
      </div>

      <Galeria
        item={aberto !== null ? TRABALHOS[aberto] : null}
        onClose={() => setAberto(null)}
        isMobile={isMobile}
        lang={lang}
      />

      <window.ContactCta lang={lang} isMobile={isMobile} />
      <window.SiteFooter lang={lang} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
