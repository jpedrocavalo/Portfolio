<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jotap Films — All works</title>
<meta name="description" content="Casamentos, aftermovies, formaturas e filmes de marca editados e tratados por Jotap." />
<link rel="icon" type="image/svg+xml" href="./favicon.svg?v=2" />

<!-- Preview ao compartilhar o link (WhatsApp, Instagram, LinkedIn...) -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Jotap Films" />
<meta property="og:title" content="Todos os trabalhos — Jotap Films" />
<meta property="og:description" content="Casamentos, aftermovies, formaturas e filmes de marca editados e tratados por Jotap." />
<meta property="og:url" content="https://jotapfilms.com/works" />
<meta property="og:image" content="https://jotapfilms.com/og.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:locale" content="pt_BR" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; background: #f5f4f0; color: #111111; -webkit-font-smoothing: antialiased; font-family: 'Inter', system-ui, sans-serif; }
  #root { width: 100%; }
  a { color: inherit; }
</style>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

</head>
<body>
<div id="root"></div>

<!-- Traduções compartilhadas + lista de vídeos (scripts normais, antes do Babel) -->
<script src="i18n.js"></script>
<script src="theme.js"></script>
<script src="media.js"></script>
<script src="videos.js"></script>
<script type="text/babel" src="site-chrome.jsx"></script>
<script type="text/babel" src="contact-modal.jsx"></script>

<script type="text/babel">
const { useState } = React;
const TH = window.THEME;
const PALETTE = TH.palette;
const FONTS = TH.fonts;

// hidden: true tira o vídeo do ar sem apagar os dados. O índice real vem
// junto porque o link (?v=) aponta pra posição em window.VIDEOS — filtrar
// antes faria os links abrirem o vídeo errado.
const VIDEOS = (window.VIDEOS || [])
  .map((v, i) => ({ video: v, indice: i }))
  .filter((x) => !x.video.hidden);

// Capa vem de media.js (Cloudflare Stream ou YouTube)

function VideoCard({ video, index, lang }) {
  const [hover, setHover] = useState(false);
  return (
    <a
      href={`./video.html?v=${index}`}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        display: 'flex', flexDirection: 'column',
        textDecoration: 'none', color: 'inherit', cursor: 'pointer',
      }}
    >
      <div style={{
        position: 'relative',
        aspectRatio: '16 / 9',
        background: PALETTE.surface,
        overflow: 'hidden',
      }}>
        {window.hasMedia(video) && (
          <img
            {...window.mediaThumbProps(video)}
            alt={video.title}
            style={{
              position: 'absolute', inset: 0, width: '100%', height: '100%',
              objectFit: 'cover',
              transform: hover ? 'scale(1.05)' : 'scale(1)',
              transition: 'transform 0.6s cubic-bezier(0.2,0.8,0.2,1)',
            }}
          />
        )}
      </div>
      <div style={{
        padding: '10px 16px 22px',
        display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', alignItems: 'baseline', gap: '4px 12px',
      }}>
        <span style={{ fontFamily: FONTS.sans, fontSize: 13, fontWeight: 500, color: PALETTE.fg }}>
          {video.title}
        </span>
        <span style={{ ...TH.label, flexShrink: 0 }}>
          {[window.tCategory(lang, video.category), video.year].filter(Boolean).join(', ')}
        </span>
      </div>
    </a>
  );
}

function App() {
  const [lang, setLangState] = React.useState(window.getInitialLang());
  const setLang = (next) => { setLangState(next); window.persistLang(next); };
  const T = window.I18N[lang];
  const [contactOpen, setContactOpen] = React.useState(false);
  const ContactModal = window.ContactModal;
  const isMobile = window.useIsMobile();
  const Seta = window.Seta;
  return (
    <div style={{ width: '100%' }}>
      {ContactModal && <ContactModal open={contactOpen} onClose={() => setContactOpen(false)} lang={lang} />}
      <window.SiteHeader current="works" lang={lang} setLang={setLang} onContactOpen={() => setContactOpen(true)} />

      {/* Bloco de título */}
      <section style={{
        padding: isMobile ? '104px 20px 36px' : '150px 40px 56px',
        display: 'grid',
        gridTemplateColumns: isMobile ? '1fr' : '1fr 1fr',
        gap: isMobile ? 24 : 40,
        alignItems: 'end',
      }}>
        <div>
          <Seta size={isMobile ? 22 : 28} />
          <h1 style={{ ...TH.heading(isMobile ? 'clamp(44px, 13vw, 72px)' : 'clamp(56px, 6.2vw, 108px)'), marginTop: isMobile ? 20 : 28 }}>
            {T.works.heading}
          </h1>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 24 }}>
          <div>
            <div style={{ ...TH.label, marginBottom: 6 }}>{T.works.allWorks}</div>
            <div style={{ fontFamily: FONTS.sans, fontSize: 13, color: PALETTE.fg }}>
              {VIDEOS.length} {VIDEOS.length === 1 ? T.works.projectSingular : T.works.projectPlural}
            </div>
          </div>
        </div>
      </section>

      {/* Grid de todos os vídeos */}
      <section style={{ padding: isMobile ? '0 20px 64px' : '0 40px 96px' }}>
        {/* Capas coladas, sangrando até a borda da tela */}
        <div style={{
          margin: `0 -${TH.pad(isMobile)}px`,
          display: 'grid',
          gridTemplateColumns: isMobile ? 'repeat(2, 1fr)' : 'repeat(auto-fill, minmax(320px, 1fr))',
          gap: 0,
        }}>
          {VIDEOS.map(({ video, indice }) => (
            <VideoCard key={indice} video={video} index={indice} lang={lang} />
          ))}
        </div>

        <a href="./index.html" style={{ ...TH.link, display: 'inline-block', marginTop: 48 }}
          onMouseEnter={(e) => (e.currentTarget.style.color = PALETTE.accent)}
          onMouseLeave={(e) => (e.currentTarget.style.color = PALETTE.fg)}
        >
          {T.backToReel}
        </a>
      </section>

      <window.ContactCta lang={lang} isMobile={isMobile} />
      <window.SiteFooter lang={lang} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
