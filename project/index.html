<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jotap Films</title>
<meta name="description" content="O olhar de montagem que transforma o seu material em lembranças vivas para os seus clientes. Parceria em pós-produção para produtoras de casamentos e eventos que valorizam histórias atemporais e prazos alinhados." />
<link rel="icon" type="image/svg+xml" href="./favicon.svg?v=2" />

<!-- Preview ao compartilhar o link (WhatsApp, Instagram, LinkedIn...) -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Jotap Films" />
<meta property="og:title" content="Jotap Films" />
<meta property="og:description" content="O olhar de montagem que transforma o seu material em lembranças vivas para os seus clientes. Parceria em pós-produção para produtoras de casamentos e eventos que valorizam histórias atemporais e prazos alinhados." />
<meta property="og:url" content="https://jotapfilms.com/" />
<meta property="og:image" content="https://jotapfilms.com/og.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:locale" content="pt_BR" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; background: #f5f4f0; color: #111111; -webkit-font-smoothing: antialiased; }
  #root { width: 100%; }
</style>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

</head>
<body>
<div id="root"></div>

<!-- Traduções compartilhadas + lista de vídeos (scripts normais, antes do Babel) -->
<script src="i18n.js"></script>
<script src="theme.js"></script>
<script src="media.js"></script>
<script src="videos.js"></script>
<script src="shortform.js"></script>
<script src="projects.js"></script>

<script type="text/babel" src="site-chrome.jsx"></script>
<script type="text/babel" src="contact-modal.jsx"></script>
<script type="text/babel" src="color-section.jsx"></script>
<script type="text/babel" src="projects-section.jsx"></script>
<script type="text/babel" src="shortform-section.jsx"></script>

<script type="text/babel">
const TH = window.THEME;
const PALETTE = TH.palette;
const FONTS = TH.fonts;

// Grid "Selected Works" = vídeos de videos.js (cada um clicável, leva pra
// ./video.html?v=<índice>). O short-form tem seção própria abaixo.
//
// Quem tem `featured: false` fica de fora daqui, mas continua aparecendo
// no "Ver tudo" (works.html). O map vem antes do filter pro href guardar
// o índice real dentro de window.VIDEOS.
const FEATURED = window.VIDEOS
  .map((v, i) => ({ ...v, href: './video.html?v=' + i }))
  .filter((v) => v.featured !== false && !v.hidden);

const COLS = 3;
const ROWS = 2;

// Card — thumbnail estático (mais leve no grid).
// fill=true → preenche o container; false → usa aspectRatio 16:9.
function Card({ data, fill, lang }) {
  const [hover, setHover] = React.useState(false);
  return (
    <div
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        width: '100%',
        height: fill ? '100%' : 'auto',
        display: 'flex',
        flexDirection: 'column',
      }}
    >
      <div style={{
        position: 'relative',
        flex: fill ? 1 : 'none',
        aspectRatio: fill ? 'auto' : '16 / 9',
        background: PALETTE.surface,
        overflow: 'hidden',
      }}>
        {window.hasMedia(data) ? (
          <img
            {...window.mediaThumbProps(data)}
            alt={data.title}
            style={{
              position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover',
              transform: hover ? 'scale(1.05)' : 'scale(1)',
              transition: 'transform 0.6s cubic-bezier(0.2,0.8,0.2,1)',
            }}
          />
        ) : data.videoSrc ? (
          <video src={data.videoSrc} autoPlay muted loop playsInline
            style={{
              position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover',
              transform: hover ? 'scale(1.05)' : 'scale(1)',
              transition: 'transform 0.6s cubic-bezier(0.2,0.8,0.2,1)',
            }} />
        ) : data.imageSrc ? (
          <img src={data.imageSrc} alt={data.title}
            style={{
              position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover',
              transform: hover ? 'scale(1.05)' : 'scale(1)',
              transition: 'transform 0.6s cubic-bezier(0.2,0.8,0.2,1)',
            }} />
        ) : null}

      </div>
      <div style={{
        padding: '10px 16px 22px', flexShrink: 0,
        display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', alignItems: 'baseline', gap: '4px 12px',
      }}>
        {/* featuredTitle = título só aqui na home; o resto do site usa title */}
        <span style={{ fontFamily: FONTS.sans, fontSize: 13, fontWeight: 500, color: PALETTE.fg }}>
          {data.featuredTitle || data.title}
        </span>
        <span style={{ ...TH.label, flexShrink: 0 }}>
          {[window.tCategory(lang, data.category), data.year].filter(Boolean).join(', ')}
        </span>
      </div>
    </div>
  );
}

// Coluna de rótulo + valor(es), como as de "Industry / Services" da referência
function Coluna({ label, items }) {
  return (
    <div>
      <div style={{ ...TH.label, marginBottom: 6 }}>{label}</div>
      {(Array.isArray(items) ? items : [items]).map((it, i) => (
        <div key={i} style={{ fontFamily: FONTS.sans, fontSize: 13, lineHeight: 1.5, color: PALETTE.fg }}>{it}</div>
      ))}
    </div>
  );
}

function App() {
  // Idioma vem de i18n.js — toggle no header.
  const [lang, setLangState] = React.useState(window.getInitialLang());
  const setLang = (next) => { setLangState(next); window.persistLang(next); };
  const T = window.I18N[lang];
  const [contactOpen, setContactOpen] = React.useState(false);
  const ContactModal = window.ContactModal;
  const ShortformSection = window.ShortformSection;
  const ProjectsSection = window.ProjectsSection;
  const isMobile = window.useIsMobile();
  const Seta = window.Seta;

  // No mobile: só os 4 primeiros vídeos. No desktop: tudo.
  const featuredItems = isMobile ? FEATURED.slice(0, 4) : FEATURED;

  return (
    <div style={{ width: '100%' }}>
      {ContactModal && <ContactModal open={contactOpen} onClose={() => setContactOpen(false)} lang={lang} />}
      <window.SiteHeader current="works" lang={lang} setLang={setLang} onContactOpen={() => setContactOpen(true)} />

      {/* Abertura: título à esquerda, colunas de info e descrição à direita */}
      <section style={{
        padding: isMobile ? '104px 20px 48px' : '150px 40px 72px',
        display: 'grid',
        gridTemplateColumns: isMobile ? '1fr' : '1fr 1fr',
        columnGap: 40, rowGap: isMobile ? 36 : 48,
        alignItems: 'start',
      }}>
        <div>
          <Seta size={isMobile ? 22 : 28} />
          <h1 style={{ ...TH.heading(isMobile ? 'clamp(44px, 13vw, 72px)' : 'clamp(56px, 6.2vw, 108px)'), marginTop: isMobile ? 20 : 28 }}>
            Jotap<br />Films
          </h1>
        </div>

        <div style={{ display: 'flex', flexDirection: 'column', gap: isMobile ? 28 : 56, paddingTop: isMobile ? 0 : 4 }}>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 24 }}>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
              <Coluna label={T.reel.roleLabel} items={T.reel.role} />
              <Coluna label={T.reel.locationLabel} items={T.reel.location} />
              <Coluna label={T.reel.serveLabel} items={T.reel.serve} />
            </div>
            <Coluna label={T.reel.servicesLabel} items={T.reel.services} />
          </div>
          <div>
            <div style={{ ...TH.label, marginBottom: 8 }}>{T.reel.descriptionLabel}</div>
            <p style={{ ...TH.body(isMobile ? 14 : 15), maxWidth: 560 }}>{T.reel.heroDescription}</p>
          </div>
        </div>
      </section>

      {/* Selected Works — 100vh com 6 cards num grid 3×2 */}
      <section id="selected" style={{
        scrollMarginTop: 56,
        height: isMobile ? 'auto' : '100vh',
        width: '100%',
        padding: isMobile ? '32px 20px 24px' : '32px 40px 0',
        display: 'flex',
        flexDirection: 'column',
      }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', paddingBottom: 20 }}>
          <div style={TH.label}>{T.reel.selectedWorks}</div>
          <a href="./works.html" style={TH.link}
            onMouseEnter={(e) => (e.currentTarget.style.color = PALETTE.accent)}
            onMouseLeave={(e) => (e.currentTarget.style.color = PALETTE.fg)}
          >
            {T.reel.seeAll}
          </a>
        </div>
        {/* Capas coladas, sangrando até a borda da tela: a margem
            negativa anula o padding da seção. */}
        <div style={{
          flex: isMobile ? 'none' : 1,
          margin: `0 -${TH.pad(isMobile)}px`,
          display: 'grid',
          // Mobile: 2 colunas, cards 16:9 naturais. Desktop: 3×2 preenchendo a altura.
          gridTemplateColumns: isMobile ? 'repeat(2, 1fr)' : `repeat(${COLS}, 1fr)`,
          gridTemplateRows:    isMobile ? 'auto' : `repeat(${ROWS}, 1fr)`,
          gap: 0,
        }}>
          {featuredItems.map((data, i) => (
            <a key={i} href={data.href} style={{
              display: 'flex', flexDirection: 'column',
              textDecoration: 'none', color: 'inherit', cursor: 'pointer',
            }}>
              <Card data={data} fill={!isMobile} lang={lang} />
            </a>
          ))}
        </div>
      </section>

      {/* Projetos — capas que abrem a lista de vídeos de cada projeto */}
      {ProjectsSection && <ProjectsSection isMobile={isMobile} lang={lang} />}

      {/* Short-form — seção pinada, cards 9:16 deslizam com o scroll */}
      {ShortformSection && <ShortformSection isMobile={isMobile} lang={lang} />}

      <window.ContactCta lang={lang} isMobile={isMobile} />
      <window.SiteFooter lang={lang} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
