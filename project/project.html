<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jotap Films — Projeto</title>
<meta name="description" content="Eventos e projetos com vários vídeos, e o look de cor desenvolvido pra cada um." />
<link rel="icon" type="image/svg+xml" href="./favicon.svg?v=2" />

<!-- Preview ao compartilhar o link (WhatsApp, Instagram, LinkedIn...) -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Jotap Films" />
<meta property="og:title" content="Projetos — Jotap Films" />
<meta property="og:description" content="Eventos e projetos com vários vídeos, e o look de cor desenvolvido pra cada um." />
<meta property="og:url" content="https://jotapfilms.com/project" />
<meta property="og:image" content="https://jotapfilms.com/og.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:locale" content="pt_BR" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; background: #f5f4f0; color: #111111; -webkit-font-smoothing: antialiased; font-family: 'Inter', system-ui, sans-serif; }
  #root { width: 100%; }
  a { color: inherit; }
</style>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

</head>
<body>
<div id="root"></div>

<script src="i18n.js"></script>
<script src="theme.js"></script>
<script src="media.js"></script>
<script src="projects.js"></script>
<script type="text/babel" src="site-chrome.jsx"></script>
<script type="text/babel" src="contact-modal.jsx"></script>
<script type="text/babel" src="color-section.jsx"></script>

<script type="text/babel">
const TH = window.THEME;
const PALETTE = TH.palette;
const FONTS = TH.fonts;

// Qual projeto mostrar: ?p=<índice> de projects.js
const PROJ_INDEX = parseInt(new URLSearchParams(location.search).get('p'), 10);
const IDX = Number.isInteger(PROJ_INDEX) ? PROJ_INDEX : 0;
const PROJ = (window.PROJECTS && window.PROJECTS[IDX])
  || { title: 'Projeto', subtitle: '', year: '', description: '', videos: [] };

// Card 16:9 de um vídeo do projeto → video.html?p=<proj>&v=<índice>
function VideoCard({ video, projIndex, index }) {
  const [hover, setHover] = React.useState(false);
  return (
    <a
      href={`./video.html?p=${projIndex}&v=${index}`}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{
        display: 'flex', flexDirection: 'column',
        textDecoration: 'none', color: 'inherit', cursor: 'pointer',
      }}
    >
      <div style={{
        position: 'relative',
        aspectRatio: '16 / 9',
        background: PALETTE.surface,
        overflow: 'hidden',
      }}>
        {window.hasMedia(video) && (
          <img
            {...window.mediaThumbProps(video)}
            alt={video.title}
            style={{
              position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover',
              transform: hover ? 'scale(1.05)' : 'scale(1)',
              filter: window.THEME.coverFilter(hover),
              transition: 'transform 0.6s cubic-bezier(0.2,0.8,0.2,1), filter 0.45s ease',
            }}
          />
        )}
      </div>

      <div style={{ padding: '10px 16px 22px', fontFamily: FONTS.sans, fontSize: 13, fontWeight: 500, color: PALETTE.fg }}>
        {video.title}
      </div>
    </a>
  );
}

function Coluna({ label, value }) {
  if (!value) return null;
  return (
    <div>
      <div style={{ ...TH.label, marginBottom: 6 }}>{label}</div>
      <div style={{ fontFamily: FONTS.sans, fontSize: 13, lineHeight: 1.5, color: PALETTE.fg }}>{value}</div>
    </div>
  );
}

function App() {
  const p = PROJ;
  const isMobile = window.useIsMobile();
  const [lang, setLangState] = React.useState(window.getInitialLang());
  const setLang = (next) => { setLangState(next); window.persistLang(next); };
  const T = window.I18N[lang];
  const t = T.projects;
  const [contactOpen, setContactOpen] = React.useState(false);
  const ContactModal = window.ContactModal;
  const ColorSection = window.ColorSection;
  const Seta = window.Seta;
  // hidden: true tira o vídeo do ar sem apagar os dados. O índice real
  // vem junto porque o link (?v=) aponta pra posição dentro de p.videos —
  // filtrar antes faria os links caírem no vídeo errado.
  const videos = (p.videos || [])
    .map((v, i) => ({ video: v, indice: i }))
    .filter((x) => !x.video.hidden);

  const contagem = videos.length > 0
    ? `${videos.length} ${videos.length === 1 ? t.videoSingular : t.videoPlural}`
    : t.soon;

  return (
    <div style={{ width: '100%' }}>
      {ContactModal && <ContactModal open={contactOpen} onClose={() => setContactOpen(false)} lang={lang} />}
      <window.SiteHeader current="works" lang={lang} setLang={setLang} onContactOpen={() => setContactOpen(true)} />

      {/* Cabeçalho do projeto: título à esquerda, ficha e descrição à direita */}
      <section style={{
        padding: isMobile ? '104px 20px 40px' : '150px 40px 64px',
        display: 'grid',
        gridTemplateColumns: isMobile ? '1fr' : '1fr 1fr',
        columnGap: 40, rowGap: isMobile ? 32 : 48,
        alignItems: 'start',
      }}>
        <div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
            <Seta size={isMobile ? 22 : 28} />
            <span style={TH.pill}>{T.video.projectLabel}</span>
          </div>
          <h1 style={{ ...TH.heading(isMobile ? 'clamp(44px, 13vw, 72px)' : 'clamp(56px, 6.2vw, 108px)'), marginTop: isMobile ? 20 : 28 }}>
            {p.title}
          </h1>
        </div>

        <div style={{ display: 'flex', flexDirection: 'column', gap: isMobile ? 28 : 56, paddingTop: isMobile ? 0 : 4 }}>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 24 }}>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
              <Coluna label={t.clientLabel} value={p.subtitle} />
              <Coluna label={t.yearLabel} value={p.year} />
            </div>
            <Coluna label={t.videosLabel} value={contagem} />
          </div>
          {p.description && (
            <div>
              <div style={{ ...TH.label, marginBottom: 8 }}>{t.descriptionLabel}</div>
              <p style={{ ...TH.body(isMobile ? 14 : 15), maxWidth: 560 }}>{p.description}</p>
            </div>
          )}
        </div>
      </section>

      {/* Vídeos do projeto */}
      <section style={{ padding: isMobile ? '32px 20px 64px' : '32px 40px 96px' }}>
        <div style={{ ...TH.label, marginBottom: 20 }}>{t.videosLabel}</div>

        {videos.length > 0 ? (
          <div style={{
            margin: `0 -${TH.pad(isMobile)}px`,
            display: 'grid',
            gridTemplateColumns: isMobile ? 'repeat(2, 1fr)' : 'repeat(auto-fill, minmax(320px, 1fr))',
            gap: 0,
          }}>
            {videos.map(({ video, indice }) => (
              <VideoCard key={indice} video={video} projIndex={IDX} index={indice} />
            ))}
          </div>
        ) : (
          <div style={{
            padding: isMobile ? '48px 20px' : '80px 40px',
            border: `1px dashed ${PALETTE.line}`,
            textAlign: 'center',
            ...TH.label,
          }}>
            {t.empty}
          </div>
        )}

        {/* Look do projeto — mesmo bloco de color dos vídeos, abaixo da lista. */}
        {ColorSection && (
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
            <ColorSection color={p.color} isMobile={isMobile} lang={lang} />
          </div>
        )}

        <a href="./index.html#projects" style={{ ...TH.link, display: 'inline-block', marginTop: isMobile ? 40 : 56 }}
          onMouseEnter={(e) => (e.currentTarget.style.color = PALETTE.accent)}
          onMouseLeave={(e) => (e.currentTarget.style.color = PALETTE.fg)}
        >
          {t.backHome}
        </a>
      </section>

      <window.ContactCta lang={lang} isMobile={isMobile} />
      <window.SiteFooter lang={lang} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
