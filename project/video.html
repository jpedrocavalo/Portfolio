<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jotap Films — Latest Work</title>
<meta name="description" content="Edição e tratamento de cor. Veja o antes e depois de cada trabalho." />
<link rel="icon" type="image/svg+xml" href="./favicon.svg" />

<!-- Preview ao compartilhar o link (WhatsApp, Instagram, LinkedIn...) -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Jotap Films" />
<meta property="og:title" content="Jotap Films" />
<meta property="og:description" content="Edição e tratamento de cor. Veja o antes e depois de cada trabalho." />
<meta property="og:url" content="https://jotapfilms.com/video" />
<meta property="og:image" content="https://jotapfilms.com/og.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:locale" content="pt_BR" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; background: #f5f4f0; color: #111111; -webkit-font-smoothing: antialiased; font-family: 'Inter', system-ui, sans-serif; }
  #root { width: 100%; }
  a { color: inherit; }
</style>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

</head>
<body>
<div id="root"></div>

<!-- Traduções compartilhadas + lista de vídeos (scripts normais, antes do Babel) -->
<script src="i18n.js"></script>
<script src="theme.js"></script>
<script src="media.js"></script>
<script src="videos.js"></script>
<script src="projects.js"></script>
<script type="text/babel" src="site-chrome.jsx"></script>
<script type="text/babel" src="contact-modal.jsx"></script>
<script type="text/babel" src="color-section.jsx"></script>

<script type="text/babel">
const TH = window.THEME;
const PALETTE = TH.palette;
const FONTS = TH.fonts;

// Qual vídeo mostrar:
//   ?v=<índice>          → vídeo de videos.js (vindo do grid da home)
//   ?p=<proj>&v=<índice> → vídeo de dentro de um projeto (projects.js)
const PARAMS = new URLSearchParams(location.search);
const VIDEO_INDEX = parseInt(PARAMS.get('v'), 10);
const PROJ_INDEX = parseInt(PARAMS.get('p'), 10);

const VAZIO = { title: 'Vídeo', year: '', category: '', streamId: '', youtubeId: '', description: '' };

const PROJETO = Number.isInteger(PROJ_INDEX)
  ? (window.PROJECTS && window.PROJECTS[PROJ_INDEX])
  : null;

const VIDEO = PROJETO
  ? ((PROJETO.videos && PROJETO.videos[VIDEO_INDEX]) || VAZIO)
  : ((window.VIDEOS && window.VIDEOS[VIDEO_INDEX])
      || (window.VIDEOS && window.VIDEOS[0])
      || VAZIO);

// "Último trabalho" só faz sentido pro índice 0 da lista principal.
const IS_LATEST = !PROJETO && (!Number.isInteger(VIDEO_INDEX) || VIDEO_INDEX === 0);

// Pra onde o botão voltar aponta: o projeto de origem, ou "Todos os trabalhos".
const VOLTAR_HREF = PROJETO ? `./project.html?p=${PROJ_INDEX}` : './works.html';

// Coluna de rótulo + valor, como "Industry / Location" da referência
function Coluna({ label, value }) {
  if (!value) return null;
  return (
    <div>
      <div style={{ ...TH.label, marginBottom: 6 }}>{label}</div>
      <div style={{ fontFamily: FONTS.sans, fontSize: 13, lineHeight: 1.5, color: PALETTE.fg }}>{value}</div>
    </div>
  );
}

function App() {
  const v = VIDEO;
  const isMobile = window.useIsMobile();
  const [lang, setLangState] = React.useState(window.getInitialLang());
  const setLang = (next) => { setLangState(next); window.persistLang(next); };
  const T = window.I18N[lang];
  const [contactOpen, setContactOpen] = React.useState(false);
  const ContactModal = window.ContactModal;
  const ColorSection = window.ColorSection;
  const Seta = window.Seta;

  // Vindo de um projeto, a etiqueta mostra o projeto em vez de
  // "último/selecionado", que ali não faz sentido.
  const etiqueta = PROJETO ? PROJETO.title : (IS_LATEST ? T.video.latestWork : T.video.selectedWork);
  const ano = v.year || (PROJETO && PROJETO.year);
  // Vídeo de projeto sem categoria própria: mostra o cliente do projeto.
  const categoria = window.tCategory(lang, v.category) || (PROJETO && PROJETO.subtitle);
  const categoriaLabel = v.category ? T.video.categoryLabel : T.projects.clientLabel;

  return (
    <div style={{ width: '100%' }}>
      {ContactModal && <ContactModal open={contactOpen} onClose={() => setContactOpen(false)} lang={lang} />}
      <window.SiteHeader current="works" lang={lang} setLang={setLang} onContactOpen={() => setContactOpen(true)} />

      {/* Cabeçalho: título à esquerda, ficha e descrição à direita */}
      <section style={{
        padding: isMobile ? '104px 20px 36px' : '150px 40px 56px',
        display: 'grid',
        gridTemplateColumns: isMobile ? '1fr' : '1fr 1fr',
        columnGap: 40, rowGap: isMobile ? 32 : 48,
        alignItems: 'start',
      }}>
        <div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
            <Seta size={isMobile ? 22 : 28} />
            <span style={TH.pill}>{etiqueta}</span>
          </div>
          <h1 style={{ ...TH.heading(isMobile ? 'clamp(36px, 10vw, 60px)' : 'clamp(40px, 4.4vw, 76px)'), marginTop: isMobile ? 20 : 28 }}>
            {v.title}
          </h1>
        </div>

        <div style={{ display: 'flex', flexDirection: 'column', gap: isMobile ? 28 : 56, paddingTop: isMobile ? 0 : 4 }}>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 24 }}>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
              <Coluna label={categoriaLabel} value={categoria} />
              <Coluna label={T.video.yearLabel} value={ano} />
            </div>
            {PROJETO && <Coluna label={T.video.projectLabel} value={PROJETO.title} />}
          </div>
          {v.description && (
            <div>
              <div style={{ ...TH.label, marginBottom: 8 }}>{T.video.descriptionLabel}</div>
              <p style={{ ...TH.body(isMobile ? 14 : 15), maxWidth: 560 }}>{v.description}</p>
            </div>
          )}
        </div>
      </section>

      <section style={{
        padding: isMobile ? '0 20px 64px' : '0 40px 96px',
        display: 'flex', flexDirection: 'column', alignItems: 'center',
      }}>
        {/* Player: 16:9, ou 9:16 quando o vídeo é vertical (Short/Reel).
            Vertical num quadro 16:9 abriria com tarjas dos dois lados;
            limitado pela altura da tela pra não virar uma coluna. */}
        <div style={{
          width: '100%',
          maxWidth: v.vertical ? 'min(100%, calc(78vh * 9 / 16))' : 'none',
          aspectRatio: v.vertical ? '9 / 16' : '16 / 9',
          margin: '0 auto',
          background: PALETTE.surface,
          border: `1px solid ${PALETTE.line}`,
          overflow: 'hidden',
          position: 'relative',
        }}>
          {window.hasMedia(v) ? (
            <iframe
              src={window.mediaPlayer(v)}
              allow={window.MEDIA_IFRAME_ALLOW}
              allowFullScreen
              style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', border: 'none' }}
            />
          ) : (
            <div style={{
              position: 'absolute', inset: 0,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              ...TH.label,
            }}>
              Adicione o streamId ou youtubeId em videos.js
            </div>
          )}
        </div>

        {/* Color — antes, depois, nodes e breakdown */}
        {ColorSection && <ColorSection color={v.color} isMobile={isMobile} lang={lang} />}

        {/* Botão voltar → o projeto de origem, ou "Todos os trabalhos" */}
        <div style={{ width: '100%', marginTop: isMobile ? 40 : 56 }}>
          <a href={VOLTAR_HREF} style={TH.link}
            onMouseEnter={(e) => (e.currentTarget.style.color = PALETTE.accent)}
            onMouseLeave={(e) => (e.currentTarget.style.color = PALETTE.fg)}
          >
            {PROJETO ? T.projects.back : `← ${T.works.allWorks}`}
          </a>
        </div>
      </section>

      <window.ContactCta lang={lang} isMobile={isMobile} />
      <window.SiteFooter lang={lang} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
