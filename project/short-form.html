<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jotap Films — Short-form</title>
<meta name="description" content="Vídeos verticais curtos, clipes para redes sociais." />
<link rel="icon" type="image/svg+xml" href="./favicon.svg?v=2" />

<!-- Preview ao compartilhar o link (WhatsApp, Instagram, LinkedIn...) -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Jotap Films" />
<meta property="og:title" content="Short-form — Jotap Films" />
<meta property="og:description" content="Vídeos verticais curtos, clipes para redes sociais." />
<meta property="og:url" content="https://jotapfilms.com/short-form" />
<meta property="og:image" content="https://jotapfilms.com/og.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:locale" content="pt_BR" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; background: #f5f4f0; color: #111111; -webkit-font-smoothing: antialiased; font-family: 'Inter', system-ui, sans-serif; }
  #root { width: 100%; }
  a { color: inherit; }
</style>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

</head>
<body>
<div id="root"></div>

<!-- Traduções compartilhadas (script normal, roda antes do Babel) -->
<script src="i18n.js"></script>
<script src="theme.js"></script>
<script src="media.js"></script>
<script src="shortform.js"></script>
<script type="text/babel" src="site-chrome.jsx"></script>
<script type="text/babel" src="contact-modal.jsx"></script>
<script type="text/babel" src="color-section.jsx"></script>
<script type="text/babel" src="shortform-section.jsx"></script>

<script type="text/babel">
const { useState } = React;
const TH = window.THEME;
const PALETTE = TH.palette;
const FONTS = TH.fonts;

// Dados vêm de shortform.js (fonte única, compartilhada com a home).
// Capa e player vêm de media.js (Cloudflare Stream ou YouTube).
// hidden: true tira o vídeo do ar sem apagar os dados dele
const SHORTFORM = (window.SHORTFORM || []).filter((v) => !v.hidden);

function App() {
  const [openIndex, setOpenIndex] = useState(null);
  const isMobile = window.useIsMobile();
  const ShortformModal = window.ShortformModal;
  const SfCard = window.SfCard;
  const [lang, setLangState] = useState(window.getInitialLang());
  const setLang = (next) => { setLangState(next); window.persistLang(next); };
  const T = window.I18N[lang];
  const [contactOpen, setContactOpen] = useState(false);
  const ContactModal = window.ContactModal;
  const Seta = window.Seta;

  return (
    <div style={{ width: '100%' }}>
      {ContactModal && <ContactModal open={contactOpen} onClose={() => setContactOpen(false)} lang={lang} />}
      <window.SiteHeader current="works" lang={lang} setLang={setLang} onContactOpen={() => setContactOpen(true)} />

      {/* Bloco de título */}
      <section style={{
        padding: isMobile ? '104px 20px 36px' : '150px 40px 56px',
        display: 'grid',
        gridTemplateColumns: isMobile ? '1fr' : '1fr 1fr',
        gap: isMobile ? 24 : 40,
        alignItems: 'end',
      }}>
        <div>
          <a href="./index.html" style={{ ...TH.link, display: 'inline-block', marginBottom: isMobile ? 20 : 28, color: PALETTE.muted }}
            onMouseEnter={(e) => (e.currentTarget.style.color = PALETTE.fg)}
            onMouseLeave={(e) => (e.currentTarget.style.color = PALETTE.muted)}
          >{T.backToWorks}</a>
          <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
            <Seta size={isMobile ? 22 : 28} />
            <span style={TH.pill}>{T.shortform.smallLabel}</span>
          </div>
          <h1 style={{ ...TH.heading(isMobile ? 'clamp(44px, 13vw, 72px)' : 'clamp(56px, 6.2vw, 108px)'), marginTop: isMobile ? 20 : 28 }}>
            {T.shortform.heading}
          </h1>
        </div>
        <div>
          <div style={{ ...TH.label, marginBottom: 8 }}>{T.home.descriptionLabel}</div>
          <p style={{ ...TH.body(isMobile ? 14 : 15), maxWidth: 560 }}>{T.shortform.intro}</p>
        </div>
      </section>

      {/* Grid — cards 9:16 com as 3 linhas de legenda do SfCard */}
      <section style={{ padding: isMobile ? '0 20px 64px' : '0 40px 96px' }}>
        <div style={{
          display: 'grid',
          gridTemplateColumns: isMobile ? 'repeat(2, 1fr)' : 'repeat(auto-fill, minmax(240px, 1fr))',
          gap: isMobile ? 12 : 24,
        }}>
          {SHORTFORM.map((item, i) => (
            <SfCard key={i} item={item} index={i} onOpen={setOpenIndex} width="100%" still />
          ))}
        </div>
      </section>

      {/* Modal estilo Instagram — vídeo 9:16 à esquerda, texto à direita */}
      {ShortformModal && (
        <ShortformModal
          item={openIndex !== null ? SHORTFORM[openIndex] : null}
          onClose={() => setOpenIndex(null)}
          isMobile={isMobile}
          lang={lang}
        />
      )}

      <window.ContactCta lang={lang} isMobile={isMobile} />
      <window.SiteFooter lang={lang} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
